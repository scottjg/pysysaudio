[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# importlib mode keeps pytest from putting the repository root on sys.path.
# Without it, tests/__init__.py makes pytest prepend the root, and
# `import pysysaudio` finds the source folder, which has no compiled
# extension, instead of the installed wheel that cibuildwheel is testing.
addopts = -v --tb=short --import-mode=importlib

